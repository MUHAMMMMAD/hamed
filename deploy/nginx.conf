# Nginx — وكيل عكسي لنظام MASARAT AI
# يُستخدم داخل docker-compose (المضيف الأعلى = اسم خدمة التطبيق "app").

upstream masarat_app {
    server app:8000;
}

server {
    listen 80;
    server_name _;                      # ضع نطاقك هنا، مثل: tender.masarat.com

    # السماح برفع ملفات BOQ / PDF كبيرة
    client_max_body_size 50M;

    location / {
        proxy_pass         http://masarat_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;          # تحليل المشاريع الكبيرة قد يستغرق وقتاً
    }

    # لتجديد شهادات Let's Encrypt (عند تفعيل HTTPS)
    # location /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    # }
}

