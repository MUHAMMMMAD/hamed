[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "masarat-ai"
version = "1.0.0"
description = "MASARAT AI Cost Intelligence Platform — multi-LLM tender pricing & estimation engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Masarat Al-Tashyeed" }]
keywords = ["construction", "tender", "estimation", "multi-llm", "pricing", "boq"]

dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "pymupdf>=1.24",
    "ezdxf>=1.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
masarat = "masarat.cli:main"

[tool.setuptools]
packages = [
    "masarat",
    "masarat.llm",
    "masarat.agents",
    "masarat.engines",
    "masarat.io",
    "masarat.reports",
]

[tool.setuptools.package-data]
masarat = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
